    <!-- Babel standalone for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

    <script type="text/babel">
        const CameraIcon = () => (

        const SparklesIcon = () => (

        const ChevronUpIcon = () => (

        const ChevronDownIcon = () => (

        const BotIcon = () => (

        );
        const SettingsIcon = () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" /></svg>
        );
        const SunIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>
        );
        const MoonIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" /></svg>
        );
        const HelpIcon = () => (
          <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>
        );
        const KeyIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" /></svg>
        );
        const ImageIcon = () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" /></svg>
        );
        const SendIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></svg>
        );
        const UserIcon = () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
        );
        const LightbulbIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 18h6m-3-3v3M12 2a7 7 0 00-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 00-7-7z" /></svg>
        );
        const RefreshIcon = () => (
          <svg className="w-4 h-4 animate-spin" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10" /><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10" /></svg>
        );

        function App() {
          const [activeTab, setActiveTab] = React.useState('scan');
          
          const [darkMode, setDarkMode] = React.useState(() => {
            try {
              const saved = localStorage.getItem('ahaariq_dark');
              return saved !== null ? JSON.parse(saved) : true;
            } catch (e) {
              return true;
            }
          });

          const [apiKey, setApiKey] = React.useState(() => {
            try {
              return localStorage.getItem('ahaariq_apikey') || '';
            } catch (e) {
              return '';
            }
          });

          const [showApiKeyModal, setShowApiKeyModal] = React.useState(() => {
            try {
              const savedKey = localStorage.getItem('ahaariq_apikey');
              const hasSeenModal = localStorage.getItem('ahaariq_seen_apikey_prompt');
              return !savedKey && !hasSeenModal;
            } catch (e) {
              return false;
            }
          });

          const [tempApiKeyInput, setTempApiKeyInput] = React.useState('');

          React.useEffect(() => {
            try {
              localStorage.setItem('ahaariq_dark', JSON.stringify(darkMode));
              if (darkMode) {
                document.documentElement.classList.add('dark');
              } else {
                document.documentElement.classList.remove('dark');
              }
            } catch (e) {}
          }, [darkMode]);

          React.useEffect(() => {
            try {
              if (apiKey) localStorage.setItem('ahaariq_apikey', apiKey);
            } catch (e) {}
          }, [apiKey]);

          const closeApiKeyModal = () => {
            try {
              localStorage.setItem('ahaariq_seen_apikey_prompt', 'true');
            } catch (e) {}
            setShowApiKeyModal(false);
          };

          const [meals, setMeals] = React.useState(() => {
            try {
              const saved = localStorage.getItem('ahaariq_logs');
              if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) return parsed;
              }
            } catch (e) {}
            return [];
          });

          const [expandedDates, setExpandedDates] = React.useState(() => {
            const todayStr = new Date().toISOString().split('T')[0];
            return { [todayStr]: true };
          });

          const [expandedMeals, setExpandedMeals] = React.useState({});

          const toggleDateAccordion = (date) => {
            setExpandedDates(prev => ({ ...prev, [date]: !prev[date] }));
          };

          const toggleMealAccordion = (mealId) => {
            setExpandedMeals(prev => ({ ...prev, [mealId]: !prev[mealId] }));
          };

          const [userProfile, setUserProfile] = React.useState(() => {
            try {
              const saved = localStorage.getItem('ahaariq_profile');
              if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed && typeof parsed === 'object') {
                  return {
                    name: parsed.name || 'Friend',
                    gender: parsed.gender || 'male',
                    age: Number(parsed.age) || 28,
                    height: Number(parsed.height) || 175,
                    weight: Number(parsed.weight) || 72,
                    activityLevel: parsed.activityLevel || 'moderate',
                    goal: parsed.goal || 'maintain',
                    dietPreference: parsed.dietPreference || 'veg'
                  };
                }
              }
            } catch (e) {}
            return {
              name: 'Friend', gender: 'male', age: 28, height: 175, weight: 72, activityLevel: 'moderate', goal: 'maintain', dietPreference: 'veg'
            };
          });

          const [dailyGoals, setDailyGoals] = React.useState({
            calories: 2000, protein: 130, carbs: 225, fat: 65
          });

          const [activeMetricModal, setActiveMetricModal] = React.useState(null);

          // Guaranteed synchronization and persistence of meal logs
          React.useEffect(() => {
            try {
              localStorage.setItem('ahaariq_logs', JSON.stringify(meals));
            } catch (e) {
              console.error("Failed to save meal logs to localStorage", e);
            }
          }, [meals]);

          React.useEffect(() => {
            try {
              let bmr = (10 * Number(userProfile.weight)) + (6.25 * Number(userProfile.height)) - (5 * Number(userProfile.age));
              if (userProfile.gender === 'male') bmr += 5;
              else bmr -= 161;

              const activityMultipliers = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, very_active: 1.9 };
              const tdee = bmr * (activityMultipliers[userProfile.activityLevel] || 1.55);

              let targetCalories = Math.round(tdee);
              if (userProfile.goal === 'lose') targetCalories -= 500;
              else if (userProfile.goal === 'gain') targetCalories += 400;
              else if (userProfile.goal === 'aggressive_lose') targetCalories -= 750;
              else if (userProfile.goal === 'lean_gain') targetCalories += 250;

              let proteinMultiplier = 1.6;
              if (userProfile.goal === 'gain' || userProfile.goal === 'lean_gain') proteinMultiplier = 2.0;
              if (userProfile.goal === 'lose' || userProfile.goal === 'aggressive_lose') proteinMultiplier = 2.2;
              
              const targetProtein = Math.round(Number(userProfile.weight) * proteinMultiplier);
              const targetFat = Math.round((targetCalories * 0.27) / 9);
              const remainingCaloriesForCarbs = Math.max(400, targetCalories - ((targetProtein * 4) + (targetFat * 9)));
              const targetCarbs = Math.round(remainingCaloriesForCarbs / 4);

              setDailyGoals({
                calories: Math.max(1200, targetCalories),
                protein: Math.max(50, targetProtein),
                carbs: Math.max(100, targetCarbs),
                fat: Math.max(30, targetFat)
              });
              localStorage.setItem('ahaariq_profile', JSON.stringify(userProfile));
            } catch (e) {}
          }, [userProfile]);

          const [selectedImage, setSelectedImage] = React.useState(null);
          const [imagePreviewUrl, setImagePreviewUrl] = React.useState('');
          const [userMealNote, setUserMealNote] = React.useState('');
          const [isAnalyzing, setIsAnalyzing] = React.useState(false);
          const [analyzedResult, setAnalyzedResult] = React.useState(null);
          const [mealType, setMealType] = React.useState('Lunch');
          const [notification, setNotification] = React.useState(null);
          const [offlineMode, setOfflineMode] = React.useState(false);

          const [showManualModal, setShowManualModal] = React.useState(false);
          const [manualForm, setManualForm] = React.useState({
            dishName: '', calories: 350, protein: 10, carbs: 50, fat: 12, mealType: 'Lunch'
          });

          const [aiCoachMessages, setAiCoachMessages] = React.useState([
            { role: 'model', text: 'Namaste! I am your AhaarIQ AI Nutrition Coach. Ask me anything about Indian diet modifications, protein sources in traditional thalis, or advice on your daily macro goals!' }
          ]);
          const [coachInput, setCoachInput] = React.useState('');
          const [isCoachLoading, setIsCoachLoading] = React.useState(false);
          const [dailyInsights, setDailyInsights] = React.useState(null);
          const [isGeneratingInsights, setIsGeneratingInsights] = React.useState(false);

          const showToast = (message) => {
            setNotification(message);
            setTimeout(() => setNotification(null), 3500);
          };

          const todayStr = new Date().toISOString().split('T')[0];
          const todaysMeals = meals.filter(m => m.date === todayStr);
          const todayTotals = todaysMeals.reduce((acc, curr) => ({
            calories: acc.calories + Number(curr.calories),
            protein: acc.protein + Number(curr.protein),
            carbs: acc.carbs + Number(curr.carbs),
            fat: acc.fat + Number(curr.fat),
          }), { calories: 0, protein: 0, carbs: 0, fat: 0 });

          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onloadend = () => {
              const base64String = reader.result.split(',')[1];
              setSelectedImage(base64String);
              setImagePreviewUrl(reader.result);
              setUserMealNote('');
            };
            reader.readAsDataURL(file);
          };

          const runMealAnalysis = async () => {
            if (!selectedImage) return;
            setIsAnalyzing(true);
            setAnalyzedResult(null);
            setOfflineMode(false);

            const noteContext = userMealNote.trim() ? ` User specific notes about this meal: "${userMealNote.trim()}".` : '';
            const prompt = `Analyze this Indian food image. The user's dietary preference is "${userProfile.dietPreference}".${noteContext} Identify the overall meal name (dishName), general description, total calories, total protein, total carbs, and total fat, respecting the user's notes and portion details if provided. Crucially, break down individual items detected with quantity, calories, protein, carbs, and fat. Return ONLY valid JSON with keys: dishName, description, calories, protein, carbs, fat, items (array of objects with itemName, quantity, calories, protein, carbs, fat).`;

            try {
              const activeKey = apiKey || "";
              if (!activeKey) throw new Error("No API key");
              const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeKey}`;
              const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: selectedImage } }] }],
                generationConfig: {
                  responseMimeType: "application/json",
                  responseSchema: {
                    type: "OBJECT",
                    properties: {
                      dishName: { type: "STRING" },
                      description: { type: "STRING" },
                      calories: { type: "NUMBER" },
                      protein: { type: "NUMBER" },
                      carbs: { type: "NUMBER" },
                      fat: { type: "NUMBER" },
                      items: {
                        type: "ARRAY",
                        items: {
                          type: "OBJECT",
                          properties: {
                            itemName: { type: "STRING" },
                            quantity: { type: "STRING" },
                            calories: { type: "NUMBER" },
                            protein: { type: "NUMBER" },
                            carbs: { type: "NUMBER" },
                            fat: { type: "NUMBER" }
                          },
                          required: ["itemName", "quantity", "calories", "protein", "carbs", "fat"]
                        }
                      }
                    },
                    required: ["dishName", "description", "calories", "protein", "carbs", "fat", "items"]
                  }
                }
              };

              const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
              const result = await response.json();
              const candidate = result.candidates?.[0];
              if (candidate && candidate.content?.parts?.[0]?.text) {
                setAnalyzedResult(JSON.parse(candidate.content.parts[0].text));
              } else {
                throw new Error("Failed");
              }
            } catch (err) {
              setOfflineMode(true);
              const customName = userMealNote.trim() || "Custom Indian Meal";
              setAnalyzedResult({
                dishName: `${customName} (Offline Fallback)`,
                description: `Analyzed with user note: "${userMealNote || 'None'}". Tailored to ${userProfile.dietPreference} preference.`,
                calories: 420, 
                protein: 16, 
                carbs: 52, 
                fat: 14,
                items: [
                  { itemName: customName, quantity: userMealNote.includes('ml') || userMealNote.includes('g') ? userMealNote : "1 serving", calories: 420, protein: 16, carbs: 52, fat: 14 }
                ]
              });
              showToast(`Analyzed successfully using AhaarIQ offline engine with your notes!`);
            } finally {
              setIsAnalyzing(false);
            }
          };

          const handleConfirmAnalyzedMeal = () => {
            if (!analyzedResult) return;
            const newEntry = {
              id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
              date: todayStr,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              mealType: mealType,
              dishName: analyzedResult.dishName,
              calories: Number(analyzedResult.calories),
              protein: Number(analyzedResult.protein),
              carbs: Number(analyzedResult.carbs),
              fat: Number(analyzedResult.fat),
              items: analyzedResult.items || [],
              image: imagePreviewUrl || 'https://placehold.co/400x300/6366f1/white?text=Indian+Meal'
            };

            setMeals(prevMeals => {
              const updated = [newEntry, ...prevMeals];
              try {
                localStorage.setItem('ahaariq_logs', JSON.stringify(updated));
              } catch (e) {}
              return updated;
            });

            showToast(`Added ${analyzedResult.dishName} to your daily log!`);
            setSelectedImage(null);
            setImagePreviewUrl('');
            setUserMealNote('');
            setAnalyzedResult(null);
            setActiveTab('history');
          };

          const handleManualSubmit = (e) => {
            e.preventDefault();
            if (!manualForm.dishName) return;

            const newEntry = {
              id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
              date: todayStr,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              mealType: manualForm.mealType,
              dishName: manualForm.dishName,
              calories: Number(manualForm.calories),
              protein: Number(manualForm.protein),
              carbs: Number(manualForm.carbs),
              fat: Number(manualForm.fat),
              items: [{ itemName: manualForm.dishName, quantity: "1 serving", calories: Number(manualForm.calories), protein: Number(manualForm.protein), carbs: Number(manualForm.carbs), fat: Number(manualForm.fat) }],
              image: 'https://placehold.co/400x300/6366f1/white?text=' + encodeURIComponent(manualForm.dishName)
            };

            setMeals(prevMeals => {
              const updated = [newEntry, ...prevMeals];
              try {
                localStorage.setItem('ahaariq_logs', JSON.stringify(updated));
              } catch (e) {}
              return updated;
            });

            setShowManualModal(false);
            setManualForm({ dishName: '', calories: 350, protein: 10, carbs: 50, fat: 12, mealType: 'Lunch' });
            showToast("Custom meal added successfully!");
            setActiveTab('history');
          };

          const deleteMeal = (id) => {
            setMeals(prevMeals => {
              const updated = prevMeals.filter(m => m.id !== id);
              try {
                localStorage.setItem('ahaariq_logs', JSON.stringify(updated));
              } catch (e) {}
              return updated;
            });
            showToast("Meal entry removed.");
          };

          const handleSendCoachMessage = async (e) => {
            e.preventDefault();
            if (!coachInput.trim() || isCoachLoading) return;
            const userMsg = coachInput.trim();
            setCoachInput('');
            const newMsgs = [...aiCoachMessages, { role: 'user', text: userMsg }];
            setAiCoachMessages(newMsgs);
            setIsCoachLoading(true);

            try {
              const activeKey = apiKey || "";
              if (!activeKey) throw new Error("No API key");
              const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeKey}`;
              const contents = newMsgs.map(m => ({ role: m.role === 'model' ? 'model' : 'user', parts: [{ text: m.text }] }));
              const payload = {
                contents: contents,
                systemInstruction: { parts: [{ text: `You are an expert AhaarIQ Indian Clinical Nutritionist & Dietitian. The user follows a "${userProfile.dietPreference}" diet. Keep responses tailored to this preference.` }] }
              };
              const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

                            </div>
                            <div className={`max-w-[85%] sm:max-w-[80%] rounded-2xl px-4 py-3 text-xs sm:text-sm shadow-md ${msg.role === 'user' ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-tr-none' : darkMode ? 'bg-[#182238] text-slate-100 rounded-tl-none border border-indigo-500/20' : 'bg-slate-100 text-slate-900 rounded-tl-none border border-slate-200'}`}>
                              <p className="whitespace-pre-wrap leading-relaxed">{msg.text}</p>
                            </div>
                          </div>
                        ))}
                        {isCoachLoading && (
                          <div className="flex items-start space-x-3">
                            <div className={`w-8 h-8 sm:w-9 sm:h-9 rounded-2xl flex items-center justify-center flex-shrink-0 ${darkMode ? 'bg-[#182238] text-indigo-300 border border-indigo-500/30' : 'bg-slate-200 text-slate-700'}`}><BotIcon /></div>
                            <div className={`rounded-2xl rounded-tl-none px-4 py-3 text-xs sm:text-sm flex items-center space-x-2.5 ${darkMode ? 'bg-[#182238] text-indigo-200 border border-indigo-500/20' : 'bg-slate-100 text-slate-700 border border-slate-200'}`}>
                              <div className="animate-spin w-4 h-4 border-2 border-indigo-500 border-t-transparent rounded-full"></div>
                              <span className="font-medium">Thinking...</span>
                            </div>
                          </div>
                        )}
                      </div>

                      <form onSubmit={handleSendCoachMessage} className={`pt-4 border-t ${darkMode ? 'border-indigo-500/10' : 'border-slate-200'} flex items-center space-x-2 sm:space-x-3`}>
                        <input 
                          type="text"
                          placeholder="Ask e.g. How to get high protein on my diet?"
                          value={coachInput}
                          onChange={(e) => setCoachInput(e.target.value)}
                          className={`flex-1 border rounded-2xl px-4 sm:px-5 py-3 sm:py-3.5 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100 placeholder:text-slate-500' : 'bg-slate-50 border-slate-300 text-slate-900'}`}
                        />
                        <button type="submit" disabled={isCoachLoading || !coachInput.trim()} className="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 disabled:opacity-50 text-white p-3 sm:p-3.5 rounded-2xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center flex-shrink-0">
                          <SendIcon />
                        </button>
                      </form>
                    </div>
                  </div>
                )}
              </main>

              {/* Manual Modal */}
              {showManualModal && (
                <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
                  <div className={`${darkMode ? 'bg-[#131b2e] border-indigo-500/30 text-slate-100' : 'bg-white border-slate-300 text-slate-900'} border rounded-3xl max-w-md w-full p-6 shadow-2xl`}>
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="font-black text-lg">Add Meal Manually</h3>
                      <button onClick={() => setShowManualModal(false)}><XIcon /></button>
                    </div>
                    <form onSubmit={handleManualSubmit} className="space-y-3">
                      <input type="text" placeholder="Dish Name (e.g. Masala Dosa)" required value={manualForm.dishName} onChange={e => setManualForm({...manualForm, dishName: e.target.value})} className={`w-full border rounded-2xl px-4 py-3 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
                      <div className="grid grid-cols-2 gap-3">
                        <input type="number" placeholder="Calories" required value={manualForm.calories} onChange={e => setManualForm({...manualForm, calories: e.target.value})} className={`w-full border rounded-2xl px-4 py-3 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
                        <input type="number" placeholder="Protein (g)" required value={manualForm.protein} onChange={e => setManualForm({...manualForm, protein: e.target.value})} className={`w-full border rounded-2xl px-4 py-3 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
                      </div>
                      <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-2xl mt-4">Save Entry</button>
                    </form>
                  </div>
                </div>
              )}

              {/* Metric Explanation Modal */}
              {activeMetricModal && (
                <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
                  <div className={`${darkMode ? 'bg-[#131b2e] border-indigo-500/30 text-slate-100' : 'bg-white border-slate-300 text-slate-900'} rounded-3xl max-w-md w-full p-6 border shadow-2xl`}>
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="font-black text-base capitalize">How {activeMetricModal} is Calculated</h3>
                      <button onClick={() => setActiveMetricModal(null)}><XIcon /></button>
                    </div>
                    <p className="text-xs sm:text-sm leading-relaxed opacity-90 mb-4">
                      {activeMetricModal === 'calories' && `Your daily calorie target (${dailyGoals.calories} kcal) is calculated using the Mifflin-St Jeor BMR formula combined with your activity level and fitness goal.`}
                      {activeMetricModal === 'protein' && `Your daily protein target (${dailyGoals.protein}g) is calculated using clinical bodyweight multipliers (${userProfile.weight}kg × multiplier based on your goal).`}
                      {activeMetricModal === 'carbs' && `Your daily carbs target (${dailyGoals.carbs}g) is allocated from your remaining daily energy expenditure after protein and fat targets.`}
                      {activeMetricModal === 'fat' && `Your daily fat target (${dailyGoals.fat}g) is set to approximately 27% of your total daily calorie target.`}
                    </p>
                    <button onClick={() => setActiveMetricModal(null)} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-2xl text-xs">Got It</button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
