<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhaarIQ - Indian Meal & Nutrition Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <!-- React & ReactDOM UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const CameraIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><circle cx="12" cy="13" r="4" /></svg>
        );
        const CalendarIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>
        );
        const TrashIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" /></svg>
        );
        const UtensilsIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 10h-1.26A8 8 0 109 20h9a2 2 0 002-2v-6a2 2 0 00-2-2z" /></svg>
        );
        const FlameIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        );
        const CheckIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
        );
        const XIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        );
        const SparklesIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>
        );
        const ChevronUpIcon = () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15" /></svg>
        );
        const ChevronDownIcon = () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" /></svg>
        );
        const BotIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2" /><circle cx="12" cy="5" r="2" /><path d="M12 7v4" /></svg>
        );
        const SettingsIcon = () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" /></svg>
        );
        const SunIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>
        );
        const MoonIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" /></svg>
        );
        const HelpIcon = () => (
          <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>
        );
        const KeyIcon = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" /></svg>
        );
        const ImageIcon = () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" /></svg>
        );

        function App() {
          const [activeTab, setActiveTab] = React.useState('scan');
          
          const [darkMode, setDarkMode] = React.useState(() => {
            try {
              const saved = localStorage.getItem('ahaariq_dark');
              return saved !== null ? JSON.parse(saved) : true;
            } catch (e) {
              return true;
            }
          });

          const [apiKey, setApiKey] = React.useState(() => {
            try {
              return localStorage.getItem('ahaariq_apikey') || '';
            } catch (e) {
              return '';
            }
          });

          const [showApiKeyModal, setShowApiKeyModal] = React.useState(() => {
            try {
              const savedKey = localStorage.getItem('ahaariq_apikey');
              const hasSeenModal = localStorage.getItem('ahaariq_seen_apikey_prompt');
              return !savedKey && !hasSeenModal;
            } catch (e) {
              return false;
            }
          });

          const [tempApiKeyInput, setTempApiKeyInput] = React.useState('');

          React.useEffect(() => {
            try {
              localStorage.setItem('ahaariq_dark', JSON.stringify(darkMode));
              if (darkMode) {
                document.documentElement.classList.add('dark');
              } else {
                document.documentElement.classList.remove('dark');
              }
            } catch (e) {}
          }, [darkMode]);

          React.useEffect(() => {
            try {
              if (apiKey) localStorage.setItem('ahaariq_apikey', apiKey);
            } catch (e) {}
          }, [apiKey]);

          const closeApiKeyModal = () => {
            try {
              localStorage.setItem('ahaariq_seen_apikey_prompt', 'true');
            } catch (e) {}
            setShowApiKeyModal(false);
          };

          const [meals, setMeals] = React.useState(() => {
            try {
              const saved = localStorage.getItem('ahaariq_logs');
              if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) return parsed;
              }
            } catch (e) {}
            return [];
          });

          const [expandedDates, setExpandedDates] = React.useState(() => {
            const todayStr = new Date().toISOString().split('T')[0];
            return { [todayStr]: true };
          });

          const [expandedMeals, setExpandedMeals] = React.useState({});

          const toggleDateAccordion = (date) => {
            setExpandedDates(prev => ({ ...prev, [date]: !prev[date] }));
          };

          const toggleMealAccordion = (mealId) => {
            setExpandedMeals(prev => ({ ...prev, [mealId]: !prev[mealId] }));
          };

          const [userProfile, setUserProfile] = React.useState(() => {
            try {
              const saved = localStorage.getItem('ahaariq_profile');
              if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed && typeof parsed === 'object') {
                  return {
                    name: parsed.name || 'Friend',
                    gender: parsed.gender || 'male',
                    age: Number(parsed.age) || 28,
                    height: Number(parsed.height) || 175,
                    weight: Number(parsed.weight) || 72,
                    activityLevel: parsed.activityLevel || 'moderate',
                    goal: parsed.goal || 'maintain'
                  };
                }
              }
            } catch (e) {}
            return {
              name: 'Friend', gender: 'male', age: 28, height: 175, weight: 72, activityLevel: 'moderate', goal: 'maintain'
            };
          });

          const [dailyGoals, setDailyGoals] = React.useState({
            calories: 2000, protein: 130, carbs: 225, fat: 65
          });

          const [activeMetricModal, setActiveMetricModal] = React.useState(null);

          React.useEffect(() => {
            try {
              localStorage.setItem('ahaariq_logs', JSON.stringify(meals));
            } catch (e) {}
          }, [meals]);

          React.useEffect(() => {
            try {
              let bmr = (10 * Number(userProfile.weight)) + (6.25 * Number(userProfile.height)) - (5 * Number(userProfile.age));
              if (userProfile.gender === 'male') bmr += 5;
              else bmr -= 161;

              const activityMultipliers = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, very_active: 1.9 };
              const tdee = bmr * (activityMultipliers[userProfile.activityLevel] || 1.55);

              let targetCalories = Math.round(tdee);
              if (userProfile.goal === 'lose') targetCalories -= 500;
              else if (userProfile.goal === 'gain') targetCalories += 400;
              else if (userProfile.goal === 'aggressive_lose') targetCalories -= 750;
              else if (userProfile.goal === 'lean_gain') targetCalories += 250;

              let proteinMultiplier = 1.6;
              if (userProfile.goal === 'gain' || userProfile.goal === 'lean_gain') proteinMultiplier = 2.0;
              if (userProfile.goal === 'lose' || userProfile.goal === 'aggressive_lose') proteinMultiplier = 2.2;
              
              const targetProtein = Math.round(Number(userProfile.weight) * proteinMultiplier);
              const targetFat = Math.round((targetCalories * 0.27) / 9);
              const remainingCaloriesForCarbs = Math.max(400, targetCalories - ((targetProtein * 4) + (targetFat * 9)));
              const targetCarbs = Math.round(remainingCaloriesForCarbs / 4);

              setDailyGoals({
                calories: Math.max(1200, targetCalories),
                protein: Math.max(50, targetProtein),
                carbs: Math.max(100, targetCarbs),
                fat: Math.max(30, targetFat)
              });
              localStorage.setItem('ahaariq_profile', JSON.stringify(userProfile));
            } catch (e) {}
          }, [userProfile]);

          const [selectedImage, setSelectedImage] = React.useState(null);
          const [imagePreviewUrl, setImagePreviewUrl] = React.useState('');
          const [isAnalyzing, setIsAnalyzing] = React.useState(false);
          const [analyzedResult, setAnalyzedResult] = React.useState(null);
          const [mealType, setMealType] = React.useState('Lunch');
          const [notification, setNotification] = React.useState(null);
          const [offlineMode, setOfflineMode] = React.useState(false);

          const [showManualModal, setShowManualModal] = React.useState(false);
          const [manualForm, setManualForm] = React.useState({
            dishName: '', calories: 350, protein: 10, carbs: 50, fat: 12, mealType: 'Lunch'
          });

          const showToast = (message) => {
            setNotification(message);
            setTimeout(() => setNotification(null), 3500);
          };

          const todayStr = new Date().toISOString().split('T')[0];
          const todaysMeals = meals.filter(m => m.date === todayStr);
          const todayTotals = todaysMeals.reduce((acc, curr) => ({
            calories: acc.calories + Number(curr.calories),
            protein: acc.protein + Number(curr.protein),
            carbs: acc.carbs + Number(curr.carbs),
            fat: acc.fat + Number(curr.fat),
          }), { calories: 0, protein: 0, carbs: 0, fat: 0 });

          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onloadend = () => {
              const base64String = reader.result.split(',')[1];
              setSelectedImage(base64String);
              setImagePreviewUrl(reader.result);
              analyzeMealImage(base64String);
            };
            reader.readAsDataURL(file);
          };

          const analyzeMealImage = async (base64Data) => {
            setIsAnalyzing(true);
            setAnalyzedResult(null);
            setOfflineMode(false);

            const prompt = "Analyze this Indian food image. Identify the overall meal name (dishName), general description, total calories, total protein, total carbs, and total fat. Crucially, break down the individual food items detected (e.g. Roti, Dal Tadka, Jeera Rice, Paneer Butter Masala, Salad) with their specific quantity, calories, protein, carbs, and fat. Return ONLY valid JSON format with keys: dishName, description, calories, protein, carbs, fat, and items (array of objects with itemName, quantity, calories, protein, carbs, fat).";

            try {
              const activeKey = apiKey || "";
              if (!activeKey) throw new Error("No API key");
              const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeKey}`;
              const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: base64Data } }] }],
                generationConfig: {
                  responseMimeType: "application/json",
                  responseSchema: {
                    type: "OBJECT",
                    properties: {
                      dishName: { type: "STRING" },
                      description: { type: "STRING" },
                      calories: { type: "NUMBER" },
                      protein: { type: "NUMBER" },
                      carbs: { type: "NUMBER" },
                      fat: { type: "NUMBER" },
                      items: {
                        type: "ARRAY",
                        items: {
                          type: "OBJECT",
                          properties: {
                            itemName: { type: "STRING" },
                            quantity: { type: "STRING" },
                            calories: { type: "NUMBER" },
                            protein: { type: "NUMBER" },
                            carbs: { type: "NUMBER" },
                            fat: { type: "NUMBER" }
                          },
                          required: ["itemName", "quantity", "calories", "protein", "carbs", "fat"]
                        }
                      }
                    },
                    required: ["dishName", "description", "calories", "protein", "carbs", "fat", "items"]
                  }
                }
              };

              const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
              const result = await response.json();
              const candidate = result.candidates?.[0];
              if (candidate && candidate.content?.parts?.[0]?.text) {
                setAnalyzedResult(JSON.parse(candidate.content.parts[0].text));
              } else {
                throw new Error("Failed");
              }
            } catch (err) {
              setOfflineMode(true);
              setAnalyzedResult({
                dishName: "Classic North Indian Thali (Offline Fallback)",
                description: "Identified traditional balanced Indian thali using AhaarIQ heuristics.",
                calories: 480, protein: 18, carbs: 64, fat: 14,
                items: [
                  { itemName: "Chapati / Roti", quantity: "2 pieces", calories: 210, protein: 6, carbs: 36, fat: 4 },
                  { itemName: "Dal Fry / Tadka", quantity: "1 bowl (150g)", calories: 150, protein: 8, carbs: 18, fat: 5 },
                  { itemName: "Green Salad", quantity: "1 plate", calories: 40, protein: 2, carbs: 8, fat: 1 },
                  { itemName: "Steamed Basmati Rice", quantity: "1 small bowl", calories: 80, protein: 2, carbs: 18, fat: 4 }
                ]
              });
              showToast("Analyzed successfully using AhaarIQ offline engine!");
            } finally {
              setIsAnalyzing(false);
            }
          };

          const handleConfirmAnalyzedMeal = () => {
            if (!analyzedResult) return;
            const newEntry = {
              id: Date.now().toString(),
              date: todayStr,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              mealType: mealType,
              dishName: analyzedResult.dishName,
              calories: Number(analyzedResult.calories),
              protein: Number(analyzedResult.protein),
              carbs: Number(analyzedResult.carbs),
              fat: Number(analyzedResult.fat),
              items: analyzedResult.items || [],
              image: imagePreviewUrl || 'https://placehold.co/400x300/6366f1/white?text=Indian+Meal'
            };

            setMeals([newEntry, ...meals]);
            showToast(`Added ${analyzedResult.dishName} to your daily log!`);
            setSelectedImage(null);
            setImagePreviewUrl('');
            setAnalyzedResult(null);
            setActiveTab('history');
          };

          const handleManualSubmit = (e) => {
            e.preventDefault();
            if (!manualForm.dishName) return;

            const newEntry = {
              id: Date.now().toString(),
              date: todayStr,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              mealType: manualForm.mealType,
              dishName: manualForm.dishName,
              calories: Number(manualForm.calories),
              protein: Number(manualForm.protein),
              carbs: Number(manualForm.carbs),
              fat: Number(manualForm.fat),
              items: [{ itemName: manualForm.dishName, quantity: "1 serving", calories: Number(manualForm.calories), protein: Number(manualForm.protein), carbs: Number(manualForm.carbs), fat: Number(manualForm.fat) }],
              image: 'https://placehold.co/400x300/6366f1/white?text=' + encodeURIComponent(manualForm.dishName)
            };

            setMeals([newEntry, ...meals]);
            setShowManualModal(false);
            setManualForm({ dishName: '', calories: 350, protein: 10, carbs: 50, fat: 12, mealType: 'Lunch' });
            showToast("Custom meal added successfully!");
            setActiveTab('history');
          };

          const deleteMeal = (id) => {
            setMeals(meals.filter(m => m.id !== id));
            showToast("Meal entry removed.");
          };

          return (
            <div className={`min-h-screen font-sans pb-24 sm:pb-12 transition-colors duration-300 ${darkMode ? 'bg-[#0b0f19] text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
              {notification && (
                <div className="fixed top-4 right-4 left-4 sm:left-auto z-50 bg-indigo-600 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center justify-center space-x-2 animate-bounce border border-indigo-400/30">
                  <SparklesIcon />
                  <span className="font-semibold text-sm truncate">{notification}</span>
                </div>
              )}

              {showApiKeyModal && (
                <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4">
                  <div className={`${darkMode ? 'bg-[#131b2e] border-indigo-500/30 text-slate-100' : 'bg-white border-slate-200 text-slate-900'} rounded-3xl max-w-md w-full p-6 sm:p-8 border shadow-2xl`}>
                    <div className="flex items-center space-x-3 mb-4">
                      <div className="bg-indigo-600/20 p-2.5 rounded-2xl text-indigo-400 border border-indigo-500/30"><KeyIcon /></div>
                      <div>
                        <h3 className="font-black text-lg">Connect Gemini API Key</h3>
                        <p className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Optional for live AI scanning</p>
                      </div>
                    </div>
                    <p className={`text-xs sm:text-sm mb-5 leading-relaxed ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                      Enter your Gemini API key for real-time AI food photo analysis. If you skip this, AhaarIQ will use its built-in offline Indian food heuristic engine!
                    </p>
                    <div className="space-y-4">
                      <input 
                        type="password"
                        placeholder="AIzaSy..."
                        value={tempApiKeyInput}
                        onChange={(e) => setTempApiKeyInput(e.target.value)}
                        className={`w-full border rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-100 border-slate-300 text-slate-900'}`}
                      />
                      <div className="flex items-center space-x-3 pt-2">
                        <button onClick={() => { setApiKey(tempApiKeyInput.trim()); closeApiKeyModal(); if(tempApiKeyInput.trim()) showToast("API key saved!"); }} className="flex-1 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold py-3.5 rounded-2xl shadow-xl transition text-sm">Save & Continue</button>
                        <button onClick={closeApiKeyModal} className={`px-5 py-3.5 rounded-2xl font-bold text-sm border transition ${darkMode ? 'bg-slate-800 text-slate-300 border-slate-700' : 'bg-slate-200 text-slate-700 border-slate-300'}`}>Skip for Now</button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Header */}
              <header className={`shadow-2xl border-b ${darkMode ? 'bg-gradient-to-r from-indigo-950 via-violet-950 to-purple-950 text-slate-100 border-indigo-900/50' : 'bg-gradient-to-r from-indigo-700 via-violet-700 to-purple-800 text-white border-indigo-600/35'}`}>
                <div className="max-w-4xl mx-auto px-4 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div className="flex items-center justify-between w-full sm:w-auto">
                    <div className="flex items-center space-x-3">
                      <div className="bg-white/15 p-2.5 rounded-2xl backdrop-blur-md shadow-inner border border-white/20"><UtensilsIcon /></div>
                      <div>
                        <h1 className="text-xl sm:text-2xl font-black tracking-tight">Hey {userProfile.name || 'Friend'}!</h1>

                        <div>
                          <label className="block text-xs font-bold mb-1.5 opacity-80">Your Name</label>
                          <input type="text" value={userProfile.name} onChange={(e) => setUserProfile({...userProfile, name: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
                        </div>
                        <div>
                          <label className="block text-xs font-bold mb-1.5 opacity-80">Gender</label>
                          <select value={userProfile.gender} onChange={(e) => setUserProfile({...userProfile, gender: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`}>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-bold mb-1.5 opacity-80">Age (Years)</label>
                          <input type="number" value={userProfile.age} onChange={(e) => setUserProfile({...userProfile, age: Number(e.target.value)})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
                        </div>
                        <div>
                          <label className="block text-xs font-bold mb-1.5 opacity-80">Height (cm)</label>
                          <input type="number" value={userProfile.height} onChange={(e) => setUserProfile({...userProfile, height: Number(e.target.value)})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
                        </div>
                        <div>
                          <label className="block text-xs font-bold mb-1.5 opacity-80">Weight (kg)</label>
                          <input type="number" value={userProfile.weight} onChange={(e) => setUserProfile({...userProfile, weight: Number(e.target.value)})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
                        </div>
                        <div>
                          <label className="block text-xs font-bold mb-1.5 opacity-80">Fitness Goal</label>
                          <select value={userProfile.goal} onChange={(e) => setUserProfile({...userProfile, goal: e.target.value})} className={`w-full border rounded-2xl px-4 py-3.5 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`}>
                            <option value="lose">Weight Loss (-500 kcal)</option>
                            <option value="maintain">Maintain Weight</option>
                            <option value="gain">Muscle Gain (+400 kcal)</option>
                          </select>
                        </div>
                      </div>
                      <div className="mt-8 flex justify-center">
                        <button onClick={() => { localStorage.setItem('ahaariq_profile', JSON.stringify(userProfile)); showToast("Profile saved successfully!"); }} className="bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold px-12 py-4 rounded-2xl shadow-xl">
                          Save
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'ai-coach' && (
                  <div className="space-y-6">
                    <div className="bg-gradient-to-br from-indigo-600 to-purple-700 rounded-3xl p-6 text-white shadow-2xl">
                      <h3 className="font-bold text-lg mb-2">Daily Indian Diet Review</h3>
                      <p className="text-xs text-indigo-200 mb-4">Get personalized feedback based on your logged meals.</p>
                      <button onClick={() => showToast("AhaarIQ AI Nutrition Insights generated!")} className="bg-white text-indigo-950 font-bold text-xs px-6 py-3.5 rounded-2xl shadow-lg">Analyze My Day</button>
                    </div>
                  </div>
                )}
              </main>

              {/* Manual Modal */}
              {showManualModal && (
                <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
                  <div className={`${darkMode ? 'bg-[#131b2e] border-indigo-500/30 text-slate-100' : 'bg-white border-slate-300 text-slate-900'} border rounded-3xl max-w-md w-full p-6 shadow-2xl`}>
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="font-black text-lg">Add Meal Manually</h3>
                      <button onClick={() => setShowManualModal(false)}><XIcon /></button>
                    </div>
                    <form onSubmit={handleManualSubmit} className="space-y-3">
                      <input type="text" placeholder="Dish Name (e.g. Masala Dosa)" required value={manualForm.dishName} onChange={e => setManualForm({...manualForm, dishName: e.target.value})} className={`w-full border rounded-2xl px-4 py-3 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
                      <div className="grid grid-cols-2 gap-3">
                        <input type="number" placeholder="Calories" required value={manualForm.calories} onChange={e => setManualForm({...manualForm, calories: e.target.value})} className={`w-full border rounded-2xl px-4 py-3 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
                        <input type="number" placeholder="Protein (g)" required value={manualForm.protein} onChange={e => setManualForm({...manualForm, protein: e.target.value})} className={`w-full border rounded-2xl px-4 py-3 text-sm ${darkMode ? 'bg-[#182238] border-indigo-500/30 text-slate-100' : 'bg-slate-50 border-slate-300 text-slate-900'}`} />
                      </div>
                      <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-2xl mt-4">Save Entry</button>
                    </form>
                  </div>
                </div>
              )}

              {/* Metric Explanation Modal */}
              {activeMetricModal && (
                <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
                  <div className={`${darkMode ? 'bg-[#131b2e] border-indigo-500/30 text-slate-100' : 'bg-white border-slate-300 text-slate-900'} rounded-3xl max-w-md w-full p-6 border shadow-2xl`}>
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="font-black text-base capitalize">How {activeMetricModal} is Calculated</h3>
                      <button onClick={() => setActiveMetricModal(null)}><XIcon /></button>
                    </div>
                    <p className="text-xs sm:text-sm leading-relaxed opacity-90 mb-4">
                      {activeMetricModal === 'protein' && `Your daily protein target (${dailyGoals.protein}g) is calculated using clinical bodyweight multipliers (${userProfile.weight}kg × multiplier based on your goal).`}
                      {activeMetricModal === 'carbs' && `Your daily carbs target (${dailyGoals.carbs}g) is allocated from your remaining daily energy expenditure after protein and fat targets.`}
                      {activeMetricModal === 'fat' && `Your daily fat target (${dailyGoals.fat}g) is set to approximately 27% of your total daily calorie target.`}
                    </p>
                    <button onClick={() => setActiveMetricModal(null)} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-2xl text-xs">Got It</button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
